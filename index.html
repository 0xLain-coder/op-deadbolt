/* ---------- exports ---------- */
function exportJSON(){
  const payload = JSON.stringify(S, null, 2);
  const blob = new Blob([payload], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'fom-tracker-' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== 'object') throw new Error('bad shape');
      if(!confirm('Importing replaces every day, error entry, module and weekly review currently stored.\n\nContinue?')) return;
      S = migrate(parsed);
      save(true);
      render(false);
      toast('Data imported');
    }catch(e){
      alert('That file could not be read as tracker JSON.\n\n' + e.message);
    }
  };
  reader.readAsText(file);
}
function resetAll(){
  if(!confirm('Reset all data?\n\nEvery day, error entry, module check, weekly review and key date will be deleted. This cannot be undone.')) return;
  localStorage.removeItem(STORE_KEY);
  S = DEFAULT_STATE();
  save(true);
  render(false);
  toast('All data reset');
}
let toastTimer = null;
function toast(msg){
  let el = $('#toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:#1a222d;border:1px solid #2f3a4c;color:#e7eef7;padding:9px 16px;border-radius:10px;font-size:12.5px;z-index:400;box-shadow:0 20px 50px -18px #000;opacity:0;transition:opacity .2s ease,transform .2s ease';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'translateX(-50%) translateY(0)'; });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(-50%) translateY(10px)'; }, 1900);
}

/* ---------- targeted refresh helpers ---------- */
function refreshSleepStats(){
  const date = UI.date;
  const rec = dayRec(date);
  const sh = rec.sleep && typeof rec.sleep.hours === 'number' ? rec.sleep.hours : null;
  const sleepCalc = $('#sleepCalc');
  if(sleepCalc){
    if(sh === null){
      sleepCalc.innerHTML = '<div class="check-note">Enter lights-out and wake time to see the hours against the 7 h floor.</div>';
    } else {
      const diff = Math.round(sh*60) - 420;
      sleepCalc.innerHTML =
        '<div class="kvline"><span class="k">Slept</span><span class="v">'+fmtDur(sh*60)+'</span></div>' +
        '<div class="check-note '+(diff>=0?'ok':(diff>=-60?'warn':'bad'))+'">'+
          (diff>=0 ? 'Above the 7 h floor · '+diff+' min spare' : Math.abs(diff)+' min below the 7 h floor')+
        '</div>';
    }
  }
  const sv = $('#statSleep');
  if(sv){
    sv.textContent = sh === null ? '—' : fmtDur(sh*60);
    const foot = $('#statSleepFoot');
    if(foot){
      foot.textContent = sh === null ? 'Not logged — floor is 7 h 00 m'
        : (sh >= 7 ? 'Above the 7 h floor · '+(Math.round(sh*60)-420)+' min spare'
                   : (Math.round(sh*60)-420)+' min below the 7 h floor');
    }
    const bar = sv.parentElement.querySelector('.bar > i');
    if(bar) bar.style.width = (sh==null?0:clamp(sh/8*100,0,100)).toFixed(0)+'%';
  }
}
function refreshFom4Balance(){
  const rec = dayRec(UI.date);
  const f = rec.fom4;
  const host = $('#f4balance');
  if(!host) return;
  const bal = (f.corrected + f.doubt) === f.flagged && f.flagged > 0
    ? '<div class="check-note ok">Balanced — every flag is accounted for.</div>'
    : (f.flagged > (f.corrected+f.doubt)
      ? '<div class="check-note bad">'+(f.flagged-(f.corrected+f.doubt))+' flag'+(f.flagged-(f.corrected+f.doubt)===1?'':'s')+' still unaccounted for.</div>'
      : '<div class="check-note warn">More corrected + doubt than flagged — check the numbers.</div>');
  host.innerHTML = bal;
}
function refreshMilestoneStats(){
  const stats = msStats(UI.date);
  const hit = $('#statMs');
  if(hit){
    hit.innerHTML = stats.hit + '<small> / ' + stats.total + '</small>';
    const bar = $('#statMsBar'); if(bar) bar.style.width = (stats.total?stats.hit/stats.total*100:0).toFixed(0)+'%';
    const foot = $('#statMsFoot');
    if(foot) foot.textContent = stats.marked+' marked · '+stats.miss+' miss'+(stats.miss===1?'':'es')+' · '+stats.hit+' hit'+(stats.hit===1?'':'s');
  }
}
function refreshMsChips(){
  /* timeline chips + HIT/MISS button states */
  const date = UI.date;
  const tl = timeline(date);
  $$('[data-chip]').forEach(el => {
    const uidv = el.dataset.chip;
    const b = tl.blocks.find(x => x.uid === uidv);
    if(!b) return;
    const m = readMs(date, b);
    const st = m ? (m.status||'') : '';
    el.className = 'tag' + (st==='hit'?' hit':st==='miss'?' miss':'');
    el.textContent = st ? st.toUpperCase() : (isBlockDone(date, b, tl) ? 'DONE' : '—');
  });
  $$('[data-hmgroup]').forEach(g => {
    const m = readMsTarget(date, g.dataset.hmgroup, g.dataset.hmkind || 'row');
    const st = m ? (m.status||'') : '';
    $$('button', g).forEach(btn => {
      btn.classList.toggle('on', btn.dataset.v === (st || 'none'));
    });
  });
  const strip = $('#stripHost');
  if(strip) strip.innerHTML = stripHTML(date);
}
function refreshEnergyViews(){
  const zoneHost = $('#zoneHost');
  const chartHost = $('#chartHost');
  const avg = weeklyEnergy(UI.date);
  const zone = energyZone(avg);
  if(zoneHost){
    zoneHost.innerHTML = zone
      ? '<div class="zone '+zone.z+'">' +
          '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
            '<div><div class="zv">'+avg.toFixed(2)+'</div><div class="tiny faint">weekly average of 35 scores</div></div>' +
            '<div style="flex:1;min-width:180px"><div style="font-size:13px;font-weight:600;margin-bottom:4px">'+zone.label+' zone</div>' +
            '<div class="tiny muted">'+esc(zone.action)+'</div></div>' +
          '</div>' +
        '</div>'
      : '<div class="zone"><div class="tiny muted">Log the five scores for this week to see the Energy Dashboard zone.</div></div>';
  }
  if(chartHost){
    const week = weekDays(UI.date);
    const colors = { sleepQuality:'#818cf8', energy:'#34d399', mood:'#fbbf24', focus:'#60a5fa', motivation:'#fb7185' };
    const series = METRICS.map(m => ({
      label:m.label, color:colors[m.k],
      values: week.map(d => { const ev=(S.days[d]&&S.days[d].energy)||{}; const val=ev[m.k]; return typeof val==='number'?val:null; })
    }));
    const avgSeries = { label:'Daily average', color:'#f5b544', values: week.map(d => {
      const ev=(S.days[d]&&S.days[d].energy)||{};
      const vals=METRICS.map(m=>ev[m.k]).filter(v=>typeof v==='number');
      return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
    })};
    chartHost.innerHTML = svgLineChart(week, series.concat([avgSeries]), { aria:'Weekly energy chart', height:250 }) +
      '<div class="legend">'+series.concat([avgSeries]).map(s=>'<div class="li"><i class="sw line" style="background:'+s.color+'"></i>'+esc(s.label)+'</div>').join('')+'</div>';
  }
}
function refreshModuleProgress(){
  const prog = moduleProgress();
  const el = $('#modProg');
  if(el) el.textContent = prog.done+' / '+prog.total+' checks · '+prog.pct.toFixed(1)+'%';
  const bar = $('#modProgBar');
  if(bar) bar.style.width = prog.pct.toFixed(1)+'%';
}

/* ---------- delegated event handling ---------- */
function onClick(e){
  const t = e.target;
  if(!t || !t.closest) return;

  /* nav close on mobile */
  const navLink = t.closest('.nav-item');
  if(navLink){ closeSidebar(); return; }

  /* mode pills */
  const modeBtn = t.closest('#modes button');
  if(modeBtn){
    const rec = dayRec(UI.date);
    rec.mode = modeBtn.dataset.mode;
    save();
    render(false);
    return;
  }

  /* date navigator */
  const nav = t.closest('[data-date-nav]');
  if(nav){
    const step = t.closest('button[data-step]');
    if(step){
      const d = addDays(UI.date, parseInt(step.dataset.step, 10));
      go(UI.page, d);
      return;
    }
  }

  /* week step */
  const wk = t.closest('button[data-week-step]');
  if(wk){
    go('weekly', addDays(weekStart(UI.date), parseInt(wk.dataset.weekStep, 10)*7));
    return;
  }

  /* tabs */
  const tab = t.closest('[data-tab]');
  if(tab){ UI.tab = tab.dataset.tab; render(false); return; }

  /* expand a timeline block */
  const exp = t.closest('[data-expand]');
  if(exp){
    const name = exp.dataset.expand;
    UI.expanded = (UI.expanded === name) ? null : name;
    render(false);
    const btn = $('[data-expand="'+CSS.escape(name)+'"]');
    if(btn) btn.focus();
    return;
  }

  /* HIT / MISS — canonical rows (milestone card) and individual timeline blocks */
  const hm = t.closest('[data-hitmiss],[data-hmt]');
  if(hm){
    const v = hm.dataset.v;
    let rec;
    if(hm.dataset.hitmiss) rec = msRec(UI.date, hm.dataset.hitmiss);
    else rec = msTargetRec(UI.date, hm.dataset.hmt, hm.dataset.hmkind || 'block');
    rec.status = (rec.status === v || v === 'none') ? '' : v;
    save();
    refreshMsChips();
    refreshMilestoneStats();
    return;
  }

  /* error entries */
  if(t.closest('[data-open-error]')){ UI.editingError = null; openModal(); return; }
  if(t.closest('[data-save-error]')){ saveErrorEntry(); return; }
  if(t.closest('[data-close-modal]')){ closeModal(); return; }
  const editErr = t.closest('[data-edit-error]');
  if(editErr){ UI.editingError = editErr.dataset.editError; openModal(); return; }
  const delErr = t.closest('[data-del-error]');
  if(delErr){
    if(confirm('Delete this error entry? This cannot be undone.')){
      S.errors = S.errors.filter(x => x.id !== delErr.dataset.delError);
      save(true); render(false); toast('Entry deleted');
    }
    return;
  }

  /* settings */
  if(t.closest('[data-export]')){ exportJSON(); toast('Exported ' + todayISO()); return; }
  if(t.closest('[data-import]')){ const el = $('#importFile'); if(el) el.click(); return; }
  if(t.closest('[data-reset]')){ resetAll(); return; }
  const delKey = t.closest('[data-del-key]');
  if(delKey){
    S.settings.keyDates = (S.settings.keyDates||[]).filter(k => k.id !== delKey.dataset.delKey);
    save(true); render(false); toast('Key date removed');
    return;
  }
  if(t.closest('[data-add-key]')){
    const date = $('#kdDate').value;
    const label = ($('#kdLabel').value||'').trim();
    const type = $('#kdType').value;
    if(!date){ alert('Pick a date first.'); return; }
    if(!label){ alert('Give the event a name.'); return; }
    S.settings.keyDates = S.settings.keyDates || [];
    S.settings.keyDates.push({ id: uid(), date, label, type });
    save(true); render(false); toast('Key date added');
    return;
  }
}

function onInput(e){
  const t = e.target;
  if(!t || !t.closest) return;

  /* milestone text / evidence */
  if(t.dataset && t.dataset.ms){
    const key = t.dataset.ms, field = t.dataset.field;
    const rec = msRec(UI.date, key);
    rec[field] = t.value;
    save();
    return;
  }
  /* milestone text / evidence on an individual timeline block */
  if(t.dataset && t.dataset.mst){
    const rec = msTargetRec(UI.date, t.dataset.mst, t.dataset.mstk || 'block');
    rec[t.dataset.field] = t.value;
    save();
    return;
  }
  /* milestone footer */
  if(t.dataset && t.dataset.msfooter){
    const rec = dayRec(UI.date);
    if(!rec.msFooter) rec.msFooter = { unfinished:'', hardest:'' };
    rec.msFooter[t.dataset.msfooter] = t.value;
    save();
    return;
  }
  /* FOM-4 tally (today widget) */
  if(t.dataset && t.dataset.fom4){
    const rec = dayRec(UI.date);
    const v = Math.max(0, parseInt(t.value, 10) || 0);
    rec.fom4[t.dataset.fom4] = v;
    save();
    refreshFom4Balance();
    return;
  }
  /* FOM-4 tally (error log, per date) */
  if(t.dataset && t.dataset.tally){
    const rec = dayRec(t.dataset.tally);
    const v = Math.max(0, parseInt(t.value, 10) || 0);
    rec.fom4[t.dataset.field] = v;
    save();
    const chartHost = $('#tallyChart');
    if(chartHost){
      const dates = [];
      for(let i=13;i>=0;i--) dates.push(addDays(todayISO(), -i));
      const rows = dates.map(d => {
        const r = dayRec(d); const f = r.fom4 || {};
        return { label:fmtDate(d,{day:'numeric',month:'short'}), x:String(parseISO(d).getDate()), a:f.flagged||0, b:f.corrected||0, color:'#f5b544', dim:(f.flagged||0)===0 };
      });
      chartHost.innerHTML = svgBarChart(rows, { aria:'FOM-4 flags per day', height:200 });
    }
    return;
  }
  /* sleep entry */
  if(t.dataset && t.dataset.sleep){
    const rec = dayRec(UI.date);
    rec.sleep[t.dataset.sleep] = t.value;
    rec.sleep.hours = sleepDuration(rec.sleep.lightsOut, rec.sleep.wake);
    save();
    refreshSleepStats();
    return;
  }
  /* improvement */
  if(t.hasAttribute && t.hasAttribute('data-improve')){
    dayRec(UI.date).improvement = t.value;
    save();
    return;
  }
  /* energy scores */
  if(t.name && t.name.indexOf('en-') === 0){
    const parts = t.name.split('-');
    const key = parts[1];
    const rec = dayRec(UI.date);
    rec.energy[key] = parseInt(t.value, 10);
    save();
    refreshEnergyViews();
    return;
  }
  /* sleepiness */
  if(t.name && t.name.indexOf('sl-') === 0){
    const parts = t.name.split('-');
    const slot = parts[1] === '1105' ? '11:05' : parts[1] === '1525' ? '15:25' : '16:45';
    const rec = dayRec(UI.date);
    rec.sleepiness[slot] = parseInt(t.value, 10);
    save();
    return;
  }
  /* nap / workout switches */
  if(t.id && t.id.indexOf('nap-') === 0){
    dayRec(UI.date).nap = t.checked; save(); return;
  }
  if(t.id && t.id.indexOf('workout-') === 0){
    dayRec(UI.date).workout = t.checked; save(); return;
  }
  if(t.dataset && t.dataset.workouttype !== undefined){
    dayRec(UI.date).workoutType = t.value; save(); return;
  }
  /* module checks */
  if(t.dataset && t.dataset.mod){
    const id = t.dataset.mod, ck = t.dataset.check;
    if(!S.modules[id]) S.modules[id] = {};
    S.modules[id][ck] = t.checked;
    save();
    refreshModuleProgress();
    const modEl = t.closest('.mod');
    if(modEl){
      const rec = S.modules[id];
      const done = MOD_CHECKS.filter(c => rec[c.k]).length;
      modEl.classList.toggle('done', done === MOD_CHECKS.length);
    }
    return;
  }
  /* weekly review numbers */
  if(t.dataset && t.dataset.wr){
    const key = weekStart(UI.date);
    if(!S.weekly[key]) S.weekly[key] = { subjects:{} };
    if(!S.weekly[key].subjects) S.weekly[key].subjects = {};
    if(!S.weekly[key].subjects[t.dataset.wr]) S.weekly[key].subjects[t.dataset.wr] = { hit:'', total:'' };
    S.weekly[key].subjects[t.dataset.wr][t.dataset.field] = t.value;
    save();
    return;
  }
  /* weekly review text */
  if(t.dataset && t.dataset.wrtext){
    const key = weekStart(UI.date);
    if(!S.weekly[key]) S.weekly[key] = { subjects:{} };
    S.weekly[key][t.dataset.wrtext] = t.value;
    save();
    return;
  }
  /* weekly review select */
  if(t.dataset && t.dataset.wrselect){
    const key = weekStart(UI.date);
    if(!S.weekly[key]) S.weekly[key] = { subjects:{} };
    S.weekly[key][t.dataset.wrselect] = t.value;
    save();
    return;
  }
  /* settings */
  if(t.dataset && t.dataset.settings){
    S.settings[t.dataset.settings] = t.value;
    save();
    renderSidebarFoot();
    return;
  }
}

function onChange(e){
  const t = e.target;
  if(!t || !t.closest) return;
  /* deload + helper toggles live outside the generic data-* scheme */
  if(t.id && t.id.indexOf('wr-deload-') === 0){
    const key = weekStart(UI.date);
    if(!S.weekly[key]) S.weekly[key] = { subjects:{} };
    S.weekly[key].deload = t.checked; save(); return;
  }
  if(t.id && t.id.indexOf('wr-helper-') === 0){
    const key = weekStart(UI.date);
    if(!S.weekly[key]) S.weekly[key] = { subjects:{} };
    S.weekly[key].helperSync = t.checked; save(); return;
  }
  /* block done toggles */
  if(t.dataset && t.dataset.blockdone){
    const rec = dayRec(UI.date);
    rec.blocks[t.dataset.blockdone] = t.checked;
    save();
    render(false);
    return;
  }
  /* date inputs inside a date-nav */
  if(t.type === 'date' && t.closest('[data-date-nav]')){
    if(t.value) go(UI.page, t.value);
    return;
  }
  if(t.type === 'file' && t.id === 'importFile'){
    if(t.files && t.files[0]) importJSON(t.files[0]);
    t.value = '';
    return;
  }
  if(t.type === 'radio' || t.type === 'checkbox' || t.type === 'date' || t.type === 'time' || t.type === 'select-one'){
    onInput(e);
  }
}

/* ---------- error entry save ---------- */
function saveErrorEntry(){
  const g = id => { const el = $('#'+id); return el ? el.value.trim() : ''; };
  const entry = {
    id: UI.editingError || uid(),
    date: g('eDate'),
    subject: g('eSubj'),
    ref: g('eRef'),
    mark: g('eMark'),
    code: g('eCode'),
    cause: g('eCause'),
    fix: g('eFix'),
    resolveDate: g('eResolve'),
    result: g('eResult')
  };
  if(!entry.date){ alert('Give the entry a date.'); return; }
  if(UI.editingError){
    const i = S.errors.findIndex(x => x.id === UI.editingError);
    if(i >= 0) S.errors[i] = entry;
  } else {
    S.errors.push(entry);
  }
  save(true);
  closeModal();
  render(false);
  toast(UI.editingError ? 'Entry updated' : 'Entry added');
}

/* ---------- sleep duration maths ---------- */
function sleepDuration(lo, wk){
  if(!lo || !wk) return null;
  let a = minutesOf(lo), b = minutesOf(wk);
  if(b <= a) b += 1440;
  const mins = b - a;
  if(mins <= 0 || mins > 1200) return null;
  return Math.round(mins/60*100)/100;
}

/* ---------- sidebar ---------- */
function openSidebar(){ $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); }
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); }

/* ---------- clock ---------- */
function updateClock(){
  const now = new Date();
  const el = $('#clock');
  if(el) el.innerHTML = fmtClock(now) + '<small>' + WD_SHORT[now.getDay()].toUpperCase() + ' · IST</small>';
  const sv = $('#streakVal');
  if(sv) sv.textContent = streakCount();
  refreshNow();
}

/* ============================================================
   Boot
   ============================================================ */
function boot(){
  load();
  UI.date = todayISO();

  /* nav */
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);

  /* modal backdrop + escape */
  document.addEventListener('mousedown', e => { if(e.target.matches('[data-modal-back]')) closeModal(); });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && $('.modal-back')) { closeModal(); return; }
    if(e.altKey && e.key === 'ArrowLeft'){ e.preventDefault(); go(UI.page, addDays(UI.date, -1)); }
    if(e.altKey && e.key === 'ArrowRight'){ e.preventDefault(); go(UI.page, addDays(UI.date, 1)); }
  });

  /* never lose the last keystroke */
  const flush = () => { if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; save(true); } };
  window.addEventListener('pagehide', flush);
  window.addEventListener('beforeunload', flush);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') flush(); });

  /* sidebar */
  $('#hamb').addEventListener('click', () => {
    const sb = $('#sidebar');
    if(sb.classList.contains('open')) closeSidebar(); else openSidebar();
  });
  $('#scrim').addEventListener('click', closeSidebar);

  /* router */
  window.addEventListener('hashchange', () => {
    const { page, date } = parseHash();
    UI.page = page;
    if(date) UI.date = date;
    UI.expanded = null;
    render(true);
  });

  /* first paint */
  if(!location.hash) location.hash = '#/today/' + todayISO();
  else navigate();

  /* clock tick */
  setInterval(updateClock, 1000);
  setInterval(() => { if(UI.page === 'today' || UI.page === 'energy') updateClock(); }, 30000);
}

document.addEventListener('DOMContentLoaded', boot);
